<!-- Latency probe: shows the host's wall-clock time (ms) as a 4x8 barcode filling the screen.
     Open fullscreen (F11) on the mirrored monitor. Bits: 24-bit time, 8-bit checksum. -->
<meta charset="utf-8">
<title>Waylus latency probe</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #g { display: grid; grid-template: repeat(4, 1fr) / repeat(8, 1fr); width: 100vw; height: 100vh; }
  #g div { background: #555; } /* bright enough to tell apart from letterbox bars */
  #g div.on { background: #fff; }
</style>
<div id="g"></div>
<script>
const g = document.getElementById('g');
const cells = [];
for (let i = 0; i < 32; i++) { const d = document.createElement('div'); g.appendChild(d); cells.push(d); }
function frame(ts) {
  // Wall-clock time of this frame (same epoch as the host's CLOCK_REALTIME).
  const ms = Math.round(performance.timeOrigin + ts) & 0xffffff;
  const sum = (((ms & 0xff) + ((ms >> 8) & 0xff) + ((ms >> 16) & 0xff)) & 0xff) ^ 0xa5;
  const bits = ms | (sum << 24);
  for (let i = 0; i < 32; i++) cells[i].className = (bits >>> i) & 1 ? 'on' : '';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
